    <div class="input-section" id="inputSection">
        <h2>Enter Your Movie Options</h2>
        <div class="movie-inputs">
            <input type="text" id="movie1" placeholder="Movie Option 1" maxlength="30">
            <input type="text" id="movie2" placeholder="Movie Option 2" maxlength="30">
            <input type="text" id="movie3" placeholder="Movie Option 3" maxlength="30">
            <input type="text" id="movie4" placeholder="Movie Option 4" maxlength="30">
        </div>
        <button onclick="setupSpinner()">🎯 Create Spinner!</button>
    </div>

    <div class="spinner-section" id="spinnerSection">
        <h2>Spin to Choose Your Movie! 🎲</h2>
        <div class="spinner-container">
            <div class="pointer"></div>
            <div class="spinner" id="spinner"></div>
        </div>
        <button onclick="spinWheel()">🌟 SPIN THE WHEEL! 🌟</button>
        <button class="back-button" onclick="goBack()">← Back to Options</button>

        <div class="result" id="result"></div>
    </div>
</div>

<script>
    let movies = [];
    let isSpinning = false;

    function setupSpinner() {
        const movie1 = document.getElementById('movie1').value.trim();
        const movie2 = document.getElementById('movie2').value.trim();
        const movie3 = document.getElementById('movie3').value.trim();
        const movie4 = document.getElementById('movie4').value.trim();

        movies = [movie1, movie2, movie3, movie4].filter(movie => movie !== '');

        if (movies.length < 2) {
            alert('Please enter at least 2 movie options!');
            return;
        }

        createSpinnerWheel();
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('spinnerSection').style.display = 'block';
        document.getElementById('result').style.display = 'none';
    }

    function createSpinnerWheel() {
        const spinner = document.getElementById('spinner');
        const colors = ['#e74c3c', '#3498db', '#f39c12', '#27ae60', '#9b59b6', '#e67e22'];
        const sectionAngle = 360 / movies.length;

        spinner.innerHTML = '';

        movies.forEach((movie, index) => {
            const section = document.createElement('div');
            section.className = 'spinner-section-item';
            section.style.background = colors[index % colors.length];
            section.style.transform = `rotate(${index * sectionAngle}deg) skew(${90 - sectionAngle}deg)`;
            section.innerHTML = `<span style="transform: skew(${-(90 - sectionAngle)}deg) rotate(${-index * sectionAngle}deg)">${movie}</span>`;
            spinner.appendChild(section);
        });
    }

    function spinWheel() {
        if (isSpinning) return;

        isSpinning = true;
        document.getElementById('result').style.display = 'none';

        const spinner = document.getElementById('spinner');
        const sectionAngle = 360 / movies.length;
        const spinAngle = Math.random() * 360 + 1440; // At least 4 full rotations

        spinner.style.transform = `rotate(${spinAngle}deg)`;

        setTimeout(() => {
            const normalizedAngle = (360 - (spinAngle % 360)) % 360;
            const winningIndex = Math.floor(normalizedAngle / sectionAngle);
            const winningMovie = movies[winningIndex];

            document.getElementById('result').innerHTML = `
                🎉 Tonight's Movie: <br>
                <strong>${winningMovie}</strong> 🎉
            `;
            document.getElementById('result').style.display = 'block';
            isSpinning = false;
        }, 3000);
    }

    function goBack() {
        document.getElementById('inputSection').style.display = 'block';
        document.getElementById('spinnerSection').style.display = 'none';
        document.getElementById('spinner').style.transform = 'rotate(0deg)';
    }

    // Add enter key support for inputs
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    setupSpinner();
                }
            });
        });
    });
</script>
